# Mirrors what the running instance extracted from newly published minutes back into git,
# so data/ keeps a reviewable history. Needs no cluster secrets – it reads public URLs.
name: opendata-snapshot
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
env:
  BASE: https://opendata.mov.varecha.work
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted results and texts
        run: |
          set -euo pipefail
          for f in $(curl -fsS "$BASE/usneseni/data/extracted.txt"); do
            curl -fsS -o "data/usneseni/extracted/$f" "$BASE/usneseni/data/extracted/$f"
          done
          for f in $(curl -fsS "$BASE/usneseni/data/texts.txt"); do
            curl -fsS -o "data/usneseni/text/$f" "$BASE/usneseni/data/text/$f"
          done
          curl -fsS -o data/usneseni/sources.json "$BASE/usneseni/data/sources.json"
      - name: Commit
        run: |
          git config user.name "otevrena-petka bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: snapshot from $BASE" && git push
