# Mirrors what the running instance extracted from newly published minutes back into git,
# so data/ keeps a reviewable history. Needs no cluster secrets – it reads public URLs.
name: opendata-snapshot
on:
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:
permissions:
  contents: write
env:
  BASE: https://otevrenapetka.cz
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download extracted results and texts
        run: |
          set -euo pipefail
          for f in $(curl -fsSL "$BASE/radnice/usneseni/data/extracted.txt"); do
            curl -fsSL -o "data/usneseni/extracted/$f" "$BASE/radnice/usneseni/data/extracted/$f"
          done
          for f in $(curl -fsSL "$BASE/radnice/usneseni/data/texts.txt"); do
            curl -fsSL -o "data/usneseni/text/$f" "$BASE/radnice/usneseni/data/text/$f"
          done
          curl -fsSL -o data/usneseni/sources.json "$BASE/radnice/usneseni/data/sources.json"
          curl -fsSL -o data/usneseni/embeddings.jsonl "$BASE/radnice/usneseni/data/embeddings.jsonl"
          curl -fsSL -o data/usneseni/geo.json "$BASE/radnice/usneseni/data/geo.json"
          curl -fsSL -o data/usneseni/geo_cache.json "$BASE/radnice/usneseni/data/geo_cache.json"
      - name: Refuse empty files
        run: |
          # a moved URL once answered with an empty redirect and the snapshot emptied the data
          for f in sources.json embeddings.jsonl geo.json geo_cache.json; do
            [ -s "data/usneseni/$f" ] || { echo "data/usneseni/$f is empty"; exit 1; }
          done
      - name: Commit
        run: |
          git config user.name "otevrena-petka bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "data: snapshot from $BASE" && git push
