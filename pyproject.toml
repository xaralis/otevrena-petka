[project]
name = "otevrena-petka"
version = "0.1.0"
description = "Otevřená Pětka – otevřená data městského obvodu Pardubice V: usnesení a hlasování, další sekce, API a MCP"
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
dependencies = [
    "anthropic>=0.80",
    "fastapi>=0.115",
    "httpx>=0.28",
    "jinja2>=3.1",
    "jsonschema>=4.26.0",
    "mcp>=1.20,<2",
    "numpy>=2",
    "pgvector>=0.4",
    "pillow>=11",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.10",
    "pyyaml>=6",
    "sentry-sdk>=2.20",
    "uvicorn[standard]>=0.34",
]

[project.scripts]
usneseni = "petka.cli:main"
petka = "petka.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/petka"]

[tool.pytest.ini_options]
testpaths = ["tests"]
